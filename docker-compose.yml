name: django-query-optimizer
services:
  lint:
    build:
      context: .
      dockerfile: Dockerfile
      target: lint
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  test:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
      target: test
      args:
        APP_UID: "${UID:-1000}"
        APP_GID: "${GID:-1000}"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      # Surface coverage.xml on the host so CI can upload it to SonarCloud.
      - ./coverage.xml:/app/coverage.xml
